<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><title>Guía Clase 6</title>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  @page { size: A4 portrait; margin: 8mm 12mm 6mm 12mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; color: #1e293b; background: #fff; font-size: 8.5px; line-height: 1.32; }
  .header-banner { background: #000; border-radius: 8px; padding: 7px 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
  .logo-title { color: #fff; font-weight: 900; font-size: 12px; }
  .logo-sub   { color: #94a3b8; font-weight: 600; font-size: 7px; letter-spacing: 2px; display: block; }
  .header-badge { background: #171c38; border: 1px solid #3b4277; color: #a5b4fc; font-weight: 700; font-size: 8px; padding: 3.5px 10px; border-radius: 99px; text-transform: uppercase; }
  .main-title  { color: #1e1b4b; font-size: 14.5px; font-weight: 800; margin-bottom: 2px; }
  .info-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 6px 9px; margin-bottom: 5px; }
</style>
</head>
<body>
  <div class="header-banner">
    <div><span class="logo-title">VIBECODE LAB</span><span class="logo-sub">CLASE 6</span></div>
    <div class="header-badge">Go-To-Market & PLG</div>
  </div>
  <h1 class="main-title">Clase 6: Product-Led Growth, AWS S3 y Tracción</h1>
  <div class="info-card">
    <p><strong>Objetivo:</strong> Implementar modelo Freemium con S3, Paywall y PostHog, dejándote listo para conseguir tus primeros 100 usuarios.</p>
  </div>
</body>
</html>
